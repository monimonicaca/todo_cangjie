
name: todo-cangjie

services:
  todoCj-sqldata:
    image: "swr.cn-north-4.myhuaweicloud.com/swr-devadv/mysql:8.0"
    environment:
      - MYSQL_ROOT_PASSWORD=Pass@word
    volumes:
      - todoCj-sqldata:/var/lib/mysql
      - ./src/contrib/todo_list_api/db/010_create_todolistdb.sql:/docker-entrypoint-initdb.d/010_create_todolistdb.sql
      - ./src/core/list/list_api/db/020_create_listdb.sql:/docker-entrypoint-initdb.d/020_create_listdb.sql
    networks:
      - todolist-cangjie-network
    ports:
      - "35206:3306"


  todo-textphotolistapi:
    image: todo-textphotolistapi
    build:
      context: .
      dockerfile: src/contrib/todo_list_api/Dockerfile
    networks:
      - todolist-cangjie-network
    ports:
      - "35210:8080"
      - "50001"


  todo-textphotolistapi-dapr:
    image: "swr.cn-north-4.myhuaweicloud.com/swr-devadv/dapr:1.14.4"
    network_mode: "service:todo-textphotolistapi"
    depends_on:
      - todo-textphotolistapi
    command: [ "./daprd",
               "-app-id", "todo-textphotolistapi",
               "-app-port", "8080",
               "-components-path", "/components",
               "-config", "/configuration/todo-configuration.yaml" ]
    volumes:
      - "./dapr/components/:/components"
      - "./dapr/configuration/:/configuration"
    restart: always

  todo-listapi:
    image: todo-listapi
    build:
      context: .
      dockerfile: src/core/list/list_api/Dockerfile
    networks:
      - todolist-cangjie-network
    ports:
      - "35220:8080"
      - "50001"


  todo-listapi-dapr:
    image: "swr.cn-north-4.myhuaweicloud.com/swr-devadv/dapr:1.14.4"
    network_mode: "service:todo-listapi"
    depends_on:
      - todo-listapi
    command: [ "./daprd",
               "-app-id", "todo-listapi",
               "-app-port", "8080",
               "-components-path", "/components",
               "-config", "/configuration/todo-configuration.yaml" ]
    volumes:
      - "./dapr/components/:/components"
      - "./dapr/configuration/:/configuration"
    restart: always


  todo-envoygateway:
    image: "swr.cn-north-4.myhuaweicloud.com/swr-devadv/envoy:v1.11.1"
    volumes:
      - ./infrastructure/envoy.yaml:/etc/envoy/envoy.yaml
    networks:
      - todolist-cangjie-network
    ports:
      - "35191:80"
      - "35181:8001"

  todo-envoygateway-dapr:
    image: "swr.cn-north-4.myhuaweicloud.com/swr-devadv/dapr:1.14.4"
    network_mode: "service:todo-envoygateway"
    depends_on:
      - todo-envoygateway
    command: [ "./daprd",
               "-app-id", "todo-envoygateway",
               "-app-port", "80",
               "-components-path", "/components"
    ]
    volumes:
      - "./dapr/components/:/components"
    restart: always 
  todo-seq:
    image: "swr.cn-north-4.myhuaweicloud.com/swr-devadv/seq:latest"
    environment:
      - ACCEPT_EULA=Y
    networks:
      - todolist-cangjie-network
    ports:
      - "35340:80"


  todo-rabbitmq:
    image: "swr.cn-north-4.myhuaweicloud.com/swr-devadv/rabbitmq:3-management-alpine"
    networks:
      - todolist-cangjie-network
    ports:
      - "35672:5672"
      - "35673:15672"
    volumes:
      - todoCj-rabbitmq-data:/var/lib/rabbitmq/
      - todoCj-rabbitmq-log:/var/log/rabbitmq/

networks:
  todolist-cangjie-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.16.0/24


volumes:
  todoCj-sqldata:
    external: false
  todoCj-rabbitmq-data:
    external: false
  todoCj-rabbitmq-log:
    external: false